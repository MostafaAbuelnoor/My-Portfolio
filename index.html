<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="robots" content="noindex">
	<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22>
			<text y=%22.9em%22 font-size=%2290%22>💻</text></svg>">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;700;800&display=swap" rel="stylesheet">
	<title>Mostafa Saher</title>
	<style>
		:root {
			--bg: #ffffff;
			--text: #1a1a1a;
			--muted: #6b6b6b;
			--line: #e5e5e5;
		}

		@media (prefers-color-scheme: dark) {
			:root {
				--bg: #121212;
				--text: #f2f2f2;
				--muted: #a0a0a0;
				--line: #2e2e2e;
			}
		}

		* {
			box-sizing: border-box;
			margin: 0;
		}

		body {
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 24px 16px;
			background: var(--bg);
			color: var(--text);
			font-family: "Nunito Sans", system-ui, sans-serif;
			text-align: center;
		}

		main {
			max-width: 560px;
		}

		.eyebrow {
			font-size: 0.8rem;
			font-weight: 700;
			letter-spacing: 0.2em;
			text-transform: uppercase;
			color: var(--muted);
		}

		h1 {
			margin: 12px 0 16px;
			font-size: clamp(2rem, 6vw, 3rem);
			font-weight: 800;
			letter-spacing: 0.02em;
		}

		p {
			line-height: 1.6;
			color: var(--muted);
		}

		hr {
			width: 48px;
			margin: 32px auto;
			border: 0;
			border-top: 2px solid var(--line);
		}

		.links {
			display: flex;
			flex-wrap: wrap;
			justify-content: center;
			gap: 12px 24px;
			padding: 0;
			list-style: none;
		}

		.links a {
			color: var(--text);
			font-weight: 700;
			text-decoration: none;
			border-bottom: 1px solid var(--line);
		}

		.links a:hover {
			border-bottom-color: var(--text);
		}
	</style>
</head>

<body>
	<main>
		<div class="eyebrow">Mostafa Saher</div>
		<h1>Under updates</h1>
		<p>I'm rebuilding this site to show what I've been working on lately. Check back soon.</p>
		<hr>
		<ul class="links">
			<li><a href="mailto:mostafasaher@gmail.com">Email</a></li>
			<li><a href="https://www.linkedin.com/in/mostafa-abuelnoor-96b2b1171/" target="_blank" rel="noopener">LinkedIn</a></li>
			<li><a href="https://github.com/MostafaAbuelnoor" target="_blank" rel="noopener">GitHub</a></li>
		</ul>
	</main>
</body>

</html>
