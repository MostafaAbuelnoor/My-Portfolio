<style>
/* Layout: a slim control bar over one large preview frame; the draft is the page, the chrome stays quiet. */
:root { --bg: #ECEDF1; --panel: #FFFFFF; --fg: #15171C; --muted: #5C6170; --line: #D6D9E1; --accent: #2348E0; --on-accent: #FFFFFF; --stage: #DCDEE5; --font: system-ui, -apple-system, "Segoe UI", sans-serif; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0F1014; --panel: #191B21; --fg: #EEEFF3; --muted: #A0A5B4; --line: #2C2F38; --accent: #8FA6FF; --on-accent: #0F1014; --stage: #08090C; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #0F1014; --panel: #191B21; --fg: #EEEFF3; --muted: #A0A5B4; --line: #2C2F38; --accent: #8FA6FF; --on-accent: #0F1014; --stage: #08090C; color-scheme: dark }
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.4 var(--font); display: flex; flex-direction: column; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--panel); border-bottom: 1px solid var(--line); }
.bar select { flex: 1 1 200px; min-width: 0; height: 40px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--fg); font: inherit; }
button, .open { height: 40px; padding: 0 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--fg); font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
button:active { transform: scale(0.97); }
button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.open { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.desc { flex: 1 1 100%; color: var(--muted); font-size: 0.88rem; min-width: 0; }
.stage { flex: 1; min-height: 0; background: var(--stage); display: flex; justify-content: center; }
iframe { width: 100%; height: 100%; border: 0; background: #fff; }
.stage.phone iframe { width: 390px; max-width: 100%; border-inline: 1px solid var(--line); }
</style>
<div class="bar">

	<button id="replay" type="button">Replay animation</button>
	<a class="open" id="open" target="_blank" rel="noopener">Open full page</a>
	<p class="desc" id="desc"></p>
</div>
<div class="stage" id="stage"><iframe id="frame" title="Draft preview"></iframe></div>

const $ = (id) => document.getElementById(id);
const pick = $('pick'), frame = $('frame'), stage = $('stage');
DRAFTS.forEach((d, i) => { const o = document.createElement('option'); o.value = i; o.textContent = d.n + '  ' + d.t; pick.append(o); });
let cur = 0;
function show(i, setHash) {
	cur = (i + DRAFTS.length) % DRAFTS.length;
	const d = DRAFTS[cur];
	pick.value = cur;
	frame.src = 'pf/' + d.f;
	$('open').href = 'pf/' + d.f;
	$('desc').textContent = d.n + ' of 100. ' + d.d;
	if (setHash) { try { location.hash = 'draft-' + d.n; } catch (e) {} }
}
function fromHash() { const m = /^#draft-(\d{2,3})$/.exec(location.hash); return m ? Math.max(0, DRAFTS.findIndex((d) => d.n === m[1])) : 0; }
$('prev').onclick = () => show(cur - 1, true);
$('next').onclick = () => show(cur + 1, true);
pick.onchange = () => show(+pick.value, true);
$('phone').onclick = (e) => { const on = stage.classList.toggle('phone'); e.currentTarget.setAttribute('aria-pressed', on); };
$('replay').onclick = () => { frame.src = frame.src; };
addEventListener('hashchange', () => { const i = fromHash(); if (i !== cur) show(i, false); });
addEventListener('keydown', (e) => { if (e.target === pick) return; if (e.key === 'ArrowRight') show(cur + 1, true); if (e.key === 'ArrowLeft') show(cur - 1, true); });
show(fromHash(), false);
</script>
